<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="pulseFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadows & Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      .grid-line {
        stroke: rgba(255, 255, 255, 0.04);
        stroke-width: 1;
      }
      .telemetry-wave {
        stroke-dasharray: 800;
        stroke-dashoffset: 800;
        animation: drawWave 6s linear infinite;
      }
      .telemetry-wave-2 {
        stroke-dasharray: 600;
        stroke-dashoffset: 600;
        animation: drawWave2 8s linear infinite reverse;
      }
      .pulse-dot {
        animation: pulseEffect 2.5s ease-in-out infinite;
      }
      .hud-radar {
        transform-origin: 1040px 180px;
        animation: rotateRadar 10s linear infinite;
      }
      .meter-bar {
        animation: barFluctuate 3s ease-in-out infinite alternate;
      }
      .badge-float {
        animation: badgeFloat 4s ease-in-out infinite alternate;
      }
      @keyframes drawWave {
        0% { stroke-dashoffset: 800; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -800; }
      }
      @keyframes drawWave2 {
        0% { stroke-dashoffset: 600; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -600; }
      }
      @keyframes pulseEffect {
        0% { r: 3; opacity: 0.4; }
        50% { r: 6; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
        100% { r: 3; opacity: 0.4; }
      }
      @keyframes rotateRadar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes barFluctuate {
        0% { width: 55px; }
        50% { width: 85px; }
        100% { width: 68px; }
      }
      @keyframes badgeFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-4px); }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glowFilter)" />
  <circle cx="1060" cy="200" r="160" fill="#818cf8" opacity="0.09" filter="url(#glowFilter)" />
  <circle cx="620" cy="300" r="120" fill="#c084fc" opacity="0.06" filter="url(#glowFilter)" />

  <!-- Background Isometric / Matrix Grid Lines -->
  <g class="grid-line">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="280" y1="0" x2="280" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="760" y1="0" x2="760" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Live Dynamic Telemetry Wave (Background Dynamic Metric) -->
  <path d="M 0,270 Q 150,220 300,260 T 600,240 T 900,270 T 1200,230 L 1200,360 L 0,360 Z" fill="url(#pulseFill)" />
  <path d="M 0,270 Q 150,220 300,260 T 600,240 T 900,270 T 1200,230" fill="none" stroke="url(#cyanLine)" stroke-width="2.5" class="telemetry-wave" />
  <path d="M 0,290 Q 200,320 400,285 T 800,295 T 1200,275" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.6" class="telemetry-wave-2" />

  <!-- Right Visual Widget: Modern macOS Activity & Thermal HUD Card -->
  <g transform="translate(870, 48)">
    <!-- Card Frame -->
    <rect width="270" height="264" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" filter="url(#softGlow)" />
    <rect width="270" height="34" rx="14" fill="#1e293b" fill-opacity="0.9" />
    <!-- Window Control Dots -->
    <circle cx="20" cy="17" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="34" cy="17" r="4.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="48" cy="17" r="4.5" fill="#10b981" opacity="0.8" />
    <text x="135" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" letter-spacing="0.5">macOS PERFORMANCE HUD</text>

    <!-- Radar / Activity Ring -->
    <circle cx="200" cy="98" r="32" fill="none" stroke="#1e293b" stroke-width="4" />
    <circle cx="200" cy="98" r="32" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="140 200" stroke-linecap="round" />
    <line x1="200" y1="98" x2="200" y2="68" stroke="#38bdf8" stroke-width="2" class="hud-radar" />
    <text x="200" y="103" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Apple M4</text>

    <!-- System Metric Gauges -->
    <!-- CPU Core Load -->
    <text x="18" y="66" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">CPU Usage (16-Core)</text>
    <rect x="18" y="74" width="110" height="6" rx="3" fill="#1e293b" />
    <rect x="18" y="74" width="76" height="6" rx="3" fill="#38bdf8" class="meter-bar" />
    <text x="138" y="81" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">68%</text>

    <!-- GPU IOReport -->
    <text x="18" y="104" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">GPU Cluster (IOReport)</text>
    <rect x="18" y="112" width="110" height="6" rx="3" fill="#1e293b" />
    <rect x="18" y="112" width="52" height="6" rx="3" fill="#818cf8" />
    <text x="138" y="119" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">47%</text>

    <!-- Thermals & Fan RPM -->
    <text x="18" y="142" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">SoC Thermals &amp; Fan</text>
    <rect x="18" y="150" width="110" height="6" rx="3" fill="#1e293b" />
    <rect x="18" y="150" width="42" height="6" rx="3" fill="#10b981" />
    <text x="138" y="157" fill="#10b981" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">48°C / 0 RPM</text>

    <!-- Unified Memory -->
    <g transform="translate(18, 175)">
      <rect width="234" height="68" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
      <text x="12" y="20" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Unified Memory Pressure</text>
      <circle cx="16" cy="38" r="4" fill="#10b981" class="pulse-dot" />
      <text x="26" y="42" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Active: <tspan fill="#f1f5f9" font-weight="600">22.4 GB</tspan> / Cached: <tspan fill="#f1f5f9" font-weight="600">14.1 GB</tspan></text>
      <text x="12" y="58" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600">Swap: 0 MB • Disk Read: 1.2 GB/s</text>
    </g>
  </g>

  <!-- Foreground Title and Content Section (Guaranteed Clear & Elevated) -->
  <g transform="translate(72, 85)">
    <!-- Category Mini-Pill Badge -->
    <g class="badge-float">
      <rect x="0" y="0" width="265" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="14" cy="14" r="4.5" fill="#38bdf8" class="pulse-dot" />
      <text x="28" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CURATED MACOS ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="74" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Segoe UI, Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      macOS System Monitoring &amp;
    </text>
    <text x="0" y="116" fill="url(#primaryGlow)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Segoe UI, Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Performance Analytics
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="152" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Segoe UI, Roboto, sans-serif" font-size="14.5" font-weight="400" letter-spacing="0.2">
      Real-Time Hardware Telemetry, Apple Silicon IOReport, Thermals &amp; Storage Analytics
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 176)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="138" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="17" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">⚡ Real-Time SoC</text>

      <!-- Pill 2 -->
      <rect x="146" y="0" width="144" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="160" y="17" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">🌡️ Fan &amp; Thermals</text>

      <!-- Pill 3 -->
      <rect x="298" y="0" width="138" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="312" y="17" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">💾 Disk &amp; Memory</text>

      <!-- Pill 4 -->
      <rect x="444" y="0" width="148" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="458" y="17" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">🛠️ SaaS &amp; Open-Source</text>
    </g>
  </g>
</svg>
